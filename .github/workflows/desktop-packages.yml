name: Desktop packages

on:
  push:
    branches:
      - work/msn-whatsapp-xp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            command: npm run dist:linux
          - platform: windows
            os: windows-latest
            command: npm run dist:win
          - platform: macos
            os: macos-latest
            command: npm run dist:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build installers
        run: ${{ matrix.command }}
      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: retro-messenger-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
