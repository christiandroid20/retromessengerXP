name: Desktop packages

on:
  push:
    branches:
      - work/msn-whatsapp-xp
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            command: npm run dist:linux
          - platform: windows
            os: windows-latest
            command: npm run dist:win
          - platform: macos
            os: macos-latest
            command: npm run dist:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build installers
        run: ${{ matrix.command }}
      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: retro-messenger-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: retro-messenger-*
          path: dist
          merge-multiple: true

      - name: Publish build release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.sha }}
          name: Build ${{ github.run_number }} (${{ github.sha }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.zip
