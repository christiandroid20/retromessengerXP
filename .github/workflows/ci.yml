name: CI

on:
  push:
    branches:
      - work/msn-whatsapp-xp
  pull_request:
    branches:
      - main
      - work/msn-whatsapp-xp

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
